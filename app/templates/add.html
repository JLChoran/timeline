{% extends "base.html" %}

{% block content %}
<section class="form-section">
  <h2>Add a New Event</h2>
  <form method="post" action="{{ url_for('timeline.add') }}">

    <label for="date">Date <span class="required">*</span></label>
    <input type="date" id="date" name="date" value="{{ form.get('date', '') }}" required />

    <label for="title">Title <span class="required">*</span></label>
    <input type="text" id="title" name="title" value="{{ form.get('title', '') }}"
           placeholder="e.g. Fall of the Roman Empire" required />

    <label for="category">Category <span class="required">*</span></label>
    <input type="text" id="category" name="category" value="{{ form.get('category', '') }}"
           placeholder="e.g. Politics, War, Science, Art" required />

    <label for="description">Description</label>
    <textarea id="description" name="description"
              placeholder="Notes, context, why this matters...">{{ form.get('description', '') }}</textarea>

    <button type="submit" class="btn-primary">Add to Timeline</button>
  </form>
</section>
{% endblock %}
